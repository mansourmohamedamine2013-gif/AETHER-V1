<style>
:root{
  --bg:#06070a; --fg:#eef1f7; --mut:rgba(238,241,247,.6); --faint:rgba(238,241,247,.08);
  --glass:rgba(24,26,36,.55); --glass-b:rgba(255,255,255,.10); --sheet:rgba(16,18,26,.94);
  --acc:#9fd8ff; --acc2:#f3b6ff; --warm:#ffb36b; --r:22px; --err:#ff5c7a;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f4f3ef; --fg:#15161b; --mut:rgba(21,22,27,.6); --faint:rgba(21,22,27,.06);
  --glass:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.75); --sheet:rgba(250,250,247,.95);
  --acc:#2c6fb0; --acc2:#b0408f; --warm:#c86a1e; --err:#c62843; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#0b0c10;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit}
.app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1b2238,#07080c 70%)}
  .app{height:880px;max-height:94vh;border-radius:38px;box-shadow:0 40px 120px rgba(0,0,0,.55)}
}
.view{position:absolute;left:0;right:0;top:0;bottom:72px;overflow-y:auto;display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-b);box-shadow:0 12px 40px rgba(0,0,0,.22)}
.ic{display:block}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .15s}
.icon:active,.acts button:active,.btn:active,.chip:active,.round:active,.s-btn:active{transform:scale(.95)}
.muted{color:var(--mut)}
.small{font-size:12px;line-height:1.5}
.quiet{margin:4px 18px 16px;font-size:11px;color:var(--mut);letter-spacing:.02em;line-height:1.5}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px;background:linear-gradient(var(--bg) 70%,rgba(0,0,0,0))}
.wordmark{font-weight:300;letter-spacing:.34em;font-size:20px;text-transform:lowercase}
.wordmark.sm{font-size:17px}
.searchbar{margin:0 16px 12px;padding:11px 14px;border-radius:16px;background:var(--faint);color:var(--mut);display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.story-dot{width:66px;flex:none;text-align:center;font-size:11px;color:var(--mut)}
.ring{width:60px;height:60px;border-radius:50%;padding:2px;margin:0 auto 6px;background:conic-gradient(var(--acc),var(--acc2),var(--warm),var(--acc));display:grid;place-items:center}
.ring.off{background:var(--faint)}
.ring>i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--bg)}
.ring.off>i{display:grid;place-items:center;color:var(--mut);font-style:normal;font-size:22px;background:transparent;border-color:transparent}
.seg{display:flex;gap:6px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:7px 13px;border-radius:999px;background:var(--faint);color:var(--mut);font-size:13px;white-space:nowrap;transition:all .2s}
.seg button.on{background:var(--fg);color:var(--bg)}
.seg.mini{padding:0 0 12px}
.seg.mini button{padding:6px 11px;font-size:12px}
.card{padding:0 0 26px;animation:rise .45s ease both}
.media{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;margin:0 12px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.media canvas,.tile canvas,.tile-sm canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{position:absolute;top:12px;left:12px;padding:6px 11px;border-radius:999px;font-size:11px;color:#fff;letter-spacing:.02em;z-index:2}
.tray{position:absolute;left:12px;right:12px;bottom:12px;border-radius:18px;padding:8px;display:flex;gap:6px;z-index:3;animation:rise .25s ease both}
.tray button{flex:1;padding:11px 6px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;white-space:nowrap}
.meta{padding:12px 18px 0}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.who b{color:var(--fg);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;color:#fff;font-weight:600;flex:none}
.av.lg{width:48px;height:48px;font-size:17px}
h3{font-weight:500;font-size:18px;margin:10px 0 6px;letter-spacing:-.01em}
.chips span{font-size:11px;color:var(--mut);margin-right:10px}
.acts{display:flex;gap:4px;margin-top:8px;align-items:center;flex-wrap:nowrap}
.acts button{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:12px;font-size:13px;color:var(--fg);transition:transform .15s}
.acts button:last-child{margin-left:auto}
.acts .on{color:var(--warm)}
.pop{animation:pop .35s ease}
.why{margin-top:12px;padding:13px 15px;border-radius:16px;font-size:13px;line-height:1.55;color:var(--mut);animation:rise .3s ease both}
.why b{color:var(--fg);font-weight:500}
.btn{display:block;width:100%;border-radius:16px;padding:14px 18px;background:var(--fg);color:var(--bg);font-weight:600;font-size:15px;margin-top:12px;text-align:center;transition:transform .15s}
.btn.ghost{background:var(--faint);color:var(--fg)}
.btn:disabled{opacity:.4}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:8px 13px;border-radius:999px;background:var(--faint);color:var(--fg);font-size:13px;transition:all .2s;text-align:left}
.chip.on{background:var(--acc);color:#06070a}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--faint);color:var(--fg);transition:transform .15s,background .2s;flex:none}
.round.sm{width:40px;height:40px}
.round.live{background:#ff3b5c;color:#fff}
.txt{width:100%;padding:13px 14px;border-radius:14px;border:0;background:var(--faint);color:var(--fg);font-size:15px;outline:none}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.auth-err{color:var(--err);font-size:13px;min-height:18px;margin:10px 0 0}
.empty{margin:18px 14px;padding:26px 22px;border-radius:var(--r);text-align:center}
.empty h3{margin:0 0 8px;font-weight:500;font-size:18px}
.empty p{color:var(--mut);font-size:14px;line-height:1.55;margin:0}
.empty .btn{margin-top:16px}
.empty .btn+.btn{margin-top:8px}
.empty .ghost{background:var(--faint)}
/* sheets */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex;animation:fade .2s ease}
.panel{width:100%;max-height:88%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px 30px;background:var(--sheet);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);animation:up .3s cubic-bezier(.2,.8,.2,1) both;scrollbar-width:none}
.panel h2{font-weight:500;margin:6px 0 10px;font-size:19px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--mut);opacity:.5;margin:4px auto 10px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:var(--faint);margin-bottom:8px;transition:all .2s}
.opt b{display:block;font-weight:500;font-size:14px}
.opt span{font-size:12px;color:var(--mut)}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--acc)}
.results{margin-top:6px}
.res{display:flex;gap:12px;align-items:center;padding:8px 0}
.res .tile-sm{position:relative;width:64px;height:80px;border-radius:14px;overflow:hidden;flex:none}
.res b{font-weight:500;font-size:14px}
.res .why-s{font-size:12px;color:var(--acc);margin-top:4px}
.swatches{display:flex;gap:10px;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
.sw-c{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px var(--bg)}
.sw-c.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
#sk{width:100%;height:auto;aspect-ratio:3/2;border-radius:16px;background:var(--faint);touch-action:none;display:block}
.mic-big{width:84px;height:84px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin:14px auto 8px;transition:transform .2s}
.mic-big.live{animation:breathe 1s ease-in-out infinite;background:#ff3b5c;color:#fff}
.voice-wrap{text-align:center;padding:6px 0}
.pick{max-height:260px;overflow-y:auto;margin-bottom:6px;scrollbar-width:none}
.steps{margin-top:14px;font-size:13px;color:var(--mut)}
.steps .bar{margin-top:8px}
.bar{height:5px;border-radius:5px;background:var(--faint);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}
.mix{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;margin-top:12px;animation:rise .5s ease both}
.mix canvas{position:absolute;inset:0;width:100%;height:100%}
.cc-prev{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:#000;margin-bottom:8px;max-height:280px}
.cc-prev img,.cc-prev video{width:100%;height:100%;object-fit:cover;display:block}
.cc-note{font-size:11px;color:var(--mut);margin:4px 0 8px;line-height:1.5}
.beat-tl{display:flex;gap:3px;height:44px;margin:12px 0 6px}
.beat-tl i{display:block;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));opacity:.85;transition:transform .15s}
.beat-tl i.hit{transform:scaleY(1.12);opacity:1}
.cut-list{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-size:14px;border-bottom:1px solid var(--faint);gap:12px}
.row:last-child{border-bottom:0}
.sw{width:46px;height:27px;border-radius:14px;background:var(--faint);position:relative;flex:none;transition:background .25s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--fg);transition:transform .25s}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(19px);background:#06070a}
/* stories */
.story{position:absolute;inset:0;background:#000;z-index:30;display:none;color:#fff}
.story.on{display:block;animation:fade .25s ease}
.story canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.prog{position:absolute;top:10px;left:12px;right:12px;height:2px;background:rgba(255,255,255,.3);z-index:4;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff}
.story.on .prog i{animation:prog 9s linear forwards}
.s-head{position:absolute;top:22px;left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:4;font-size:14px}
.s-head .muted{color:rgba(255,255,255,.7);font-size:12px;flex:1}
.s-head .icon{color:#fff}
.s-foot{position:absolute;left:14px;right:14px;bottom:18px;z-index:4}
.s-pill{display:inline-block;padding:8px 13px;border-radius:999px;font-size:12px;margin-bottom:10px;color:#fff}
.tray-n{padding:12px 14px;border-radius:20px;margin-bottom:10px;animation:rise .25s ease both}
.tray-n .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:4px}
.tray-n .chip{background:rgba(255,255,255,.14);color:#fff}
.tray-n .chip.on{background:#fff;color:#000}
.s-btn{width:100%;padding:14px;border-radius:18px;background:rgba(255,255,255,.92);color:#000;font-weight:600;font-size:15px}
/* camera */
.cam{position:relative;height:100%;display:flex;flex-direction:column;background:#000;color:#fff}
.vf{position:relative;flex:1;overflow:hidden;margin:8px 8px 0;border-radius:28px;background:#0a0a0a}
.vf>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.look-row{position:absolute;top:12px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none;z-index:3}
.look-row::-webkit-scrollbar{display:none}
.look-row .chip{background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.look-row .chip.on{background:#fff;color:#000}
.rec{position:absolute;top:14px;right:16px;z-index:3;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.45)}
.rec::before{content:'';width:8px;height:8px;border-radius:50%;background:#ff3b5c;animation:breathe 1s infinite}
.understood{position:absolute;left:12px;right:12px;bottom:12px;padding:12px 14px;border-radius:18px;z-index:3;font-size:13px;line-height:1.5;color:#fff;animation:rise .3s ease both}
.understood small{opacity:.7;display:block;margin-top:4px;font-size:11px}
.cam-note{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);text-align:center;font-size:13px;color:rgba(255,255,255,.7);z-index:2;pointer-events:none}
.cam-bottom{display:flex;justify-content:space-around;align-items:center;padding:14px 24px 6px}
.cam .round{background:rgba(255,255,255,.14);color:#fff;width:54px;height:54px}
.shutter{width:80px;height:80px;border-radius:50%;border:4px solid #fff;padding:6px;transition:transform .15s}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:all .2s}
.shutter.rec span{transform:scale(.5);border-radius:16px;background:#ff3b5c}
.shutter:active{transform:scale(.95)}
.cam-hint{text-align:center;color:rgba(255,255,255,.55);font-size:12px;padding:0 24px 12px;line-height:1.5}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.cam-flash.go{animation:flash .35s ease}
/* direct */
.thread{display:flex;gap:12px;padding:12px 18px;align-items:center;width:100%;text-align:left;transition:background .2s}
.thread:active{background:var(--faint)}
.thread .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.thread .tx span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.thread .tx b{font-weight:500;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.chat{display:flex;flex-direction:column;height:100%}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;position:sticky;top:0;z-index:4;background:var(--bg)}
.chat-h b{font-weight:500}
.msgs{flex:1;overflow-y:auto;padding:6px 14px 10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.b{max-width:76%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.4;word-wrap:break-word;animation:rise .3s ease both}
.b.me{margin-left:auto;background:var(--fg);color:var(--bg);border-bottom-right-radius:6px}
.b.them{background:var(--faint);border-bottom-left-radius:6px}
.b.mem{padding:8px;display:flex;flex-direction:column;gap:6px;width:190px;max-width:76%}
.b.mem span{font-size:12px;padding:0 4px 2px}
.tile-sm{position:relative;width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden}
.b.voice{display:flex;align-items:center;gap:2px;min-width:170px;height:44px}
.b.voice i{display:inline-block;width:3px;border-radius:3px;background:currentColor;opacity:.8}
.b.voice span{margin-left:8px;font-size:12px;opacity:.8}
.sugg{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.sugg .chip{white-space:nowrap;background:var(--glass);border:1px solid var(--glass-b)}
.compose{display:flex;gap:8px;align-items:center;padding:8px 12px 12px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;bottom:0}
.compose .txt{padding:11px 14px;border-radius:999px}
.compose .round{margin:0}
.recline{font-size:12px;color:#ff3b5c;padding:0 16px 6px}
/* profile */
.hero{display:flex;flex-direction:column;align-items:center;padding:20px 18px 6px;text-align:center}
.av-xl{width:96px;height:96px;border-radius:50%;padding:3px;background:conic-gradient(var(--acc),var(--acc2),var(--warm),var(--acc));margin-bottom:12px}
.av-xl>i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);font-style:normal;font-size:30px;font-weight:300;background:var(--bg)}
.hero h2{margin:0;font-weight:500;font-size:20px}
.bio{margin:10px 0 0;max-width:300px;font-size:14px;line-height:1.5;color:var(--mut)}
.stats{display:flex;justify-content:space-around;width:100%;padding:18px 0 4px}
.stats b{display:block;font-size:18px;font-weight:500}
.stats span{font-size:11px;color:var(--mut)}
.sec{padding:18px 18px 6px}
.sec h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:0 0 12px}
.dna{display:grid;gap:10px}
.dna div{display:grid;grid-template-columns:82px 1fr 34px;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.dna b{font-weight:500;color:var(--fg)}
.dna em{font-style:normal;text-align:right}
.twin{margin:12px 18px 0;padding:16px;border-radius:var(--r)}
.twin p{font-size:13px;color:var(--mut);line-height:1.5;margin:0 0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--faint)}
.foot{font-size:11px;color:var(--mut);text-align:center;padding:14px 24px 26px;line-height:1.5}
/* auth */
.auth{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:28px 26px;overflow-y:auto;scrollbar-width:none}
.auth h1{font-weight:300;letter-spacing:.3em;font-size:32px;text-transform:lowercase;margin:0 0 10px}
.auth .lead{color:var(--mut);font-size:15px;line-height:1.55;margin:0 0 26px}
.auth .step{font-size:12px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.auth h2{font-weight:500;font-size:22px;margin:0 0 18px}
.auth .foot{padding:18px 0 0}
.handle-ok{font-size:12px;margin-top:-6px;margin-bottom:10px;color:var(--mut)}
.toast{position:absolute;top:16px;left:50%;transform:translate(-50%,-160%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:60;padding:11px 18px;border-radius:999px;font-size:13px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
/* tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;justify-content:space-around;align-items:center;padding:0 10px 6px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);z-index:10;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);min-width:56px;transition:color .2s,transform .15s}
.tab.on{color:var(--fg)}
.tab:active{transform:scale(.92)}
.tab .plus{width:46px;height:34px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes breathe{50%{opacity:.45}}
@keyframes prog{to{width:100%}}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="view" id="v-feed"></section>
  <section class="view" id="v-cam"></section>
  <section class="view" id="v-dm"></section>
  <section class="view" id="v-profile"></section>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="auth" id="auth" hidden></div>
  <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
  <div class="story" id="story"></div>
  <div class="toast glass" id="toast"></div>
</div>

<script>
'use strict';
/* ============================ 0. UTILITIES ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  remix:'<circle cx="8.5" cy="12" r="5"/><circle cx="15.5" cy="12" r="5"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  logout:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>'
};
const svg = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ============================ 1. ACCOUNTS + STATE ============================ */
/* Prototype accounts live in this browser's storage (no server). Passwords are hashed with
   SHA-256 when available. Production uses Supabase Auth (see blueprint). */
const ACC_KEY='aether.accounts', SESSION_KEY='aether.session';
const DEFAULT = () => ({
  sound:'lofi', mood:'calm', intent:'foryou', motion:true, nudgePerm:true,
  liked:[], saved:[], adapt:{}, theme:'auto', twin:0, taste:{}, posts:[], dm:[]
});
let user = null, state = DEFAULT();
const accounts = () => { try { return JSON.parse(localStorage.getItem(ACC_KEY)||'[]'); } catch(e){ return []; } };
const saveAccounts = a => localStorage.setItem(ACC_KEY, JSON.stringify(a));
function save(){
  if(!user) return;
  try { localStorage.setItem('aether.data.'+user.id, JSON.stringify(state)); }
  catch(e){ toast('Storage is full. Remove a memory to keep saving.'); }
}
function loadSession(){
  const sid=localStorage.getItem(SESSION_KEY); if(!sid) return false;
  const acc=accounts().find(a=>a.id===sid); if(!acc) return false;
  user=acc;
  try { state={...DEFAULT(), ...JSON.parse(localStorage.getItem('aether.data.'+sid)||'{}')}; } catch(e){ state=DEFAULT(); }
  return true;
}
async function hashPw(pw, salt){
  const data=salt+':'+pw;
  if(window.crypto && crypto.subtle){
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h=2166136261; for(const ch of data){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); }
  return 'fnv'+(h>>>0).toString(16);
}
function adaptOf(id){ if(!state.adapt[id]) state.adapt[id]={light:'auto', ambient:'none', depth:1}; return state.adapt[id]; }

/* Content is derived only from this account's own data. Zero other users exist yet. */
let POSTS=[], MY=[], ALL=[], STORIES=[], THREADS=[];
function syncContent(){
  POSTS=state.posts; MY=state.posts; ALL=state.posts;
  STORIES=state.posts.map(p=>({user:user.handle, post:p.id, me:true}));
  THREADS=[{id:'self', name:'Notes to self', color:'#9fd8ff', msgs:state.dm}];
}
const P = id => ALL.find(p => p.id === +id);
const canNudge = s => s.me ? state.nudgePerm : !!s.perm;

/* ============================ 2. CONSTANTS ============================ */
const SOUNDS={lofi:{label:'Lo-fi',bpm:80,hue:-8}, jazz:{label:'Jazz',bpm:96,hue:6}, synth:{label:'Synth',bpm:124,hue:24}, ambient:{label:'Ambient',bpm:60,hue:-20}};
const SONGS={'Lo-fi rain':{bpm:80,hue:-8}, 'Sunset jazz':{bpm:96,hue:6}, 'Night drive':{bpm:118,hue:18}, 'Silence':{bpm:60,hue:-20}};
const MOODS={calm:{label:'Calm',sat:.75,light:.02,depth:.8}, bright:{label:'Bright',sat:1.2,light:.06,depth:1}, moody:{label:'Moody',sat:.85,light:-.12,depth:1.1}, dreamy:{label:'Dreamy',sat:.95,light:.08,depth:1.4}};
const PHASES={
  dawn:{name:'dawn', tint:[255,170,140], a:.12, light:0},
  day:{name:'day', tint:[255,255,240], a:.03, light:.02},
  golden:{name:'golden hour', tint:[255,150,60], a:.18, light:.04},
  night:{name:'night', tint:[30,40,110], a:.32, light:-.1}
};
const INTENTS={foryou:'For you', craft:'Craft', calm:'Calm', friends:'Friends'};
const ATMOS=[['none','Clear'],['fog','Fog'],['golden','Golden'],['neon','Neon'],['snow','Snow'],['rain','Rain']];
const INTEREST_KEYS=['film','neon','minimal','architectural','warm','muted','street','golden','night','vivid','winter','cyberpunk'];
const MOOD_KEYS=['calm','joyful','nostalgic','moody','dreamy','bright'];
const SWATCH=[{k:'warm',hex:'#ff8a3d'},{k:'cool',hex:'#4aa3ff'},{k:'pink',hex:'#ff4fa3'},{k:'pale',hex:'#eeeeee'},{k:'deep',hex:'#1b1f3a'}];
const DEFAULT_PAL=['#1b1f2a','#4a4f63','#d9d2c5'];
const LOOK_TAGS={film:'film',tokyo:'neon',night:'night',winter:'winter',autumn:'warm',spring:'vivid',summer:'warm',golden:'golden',noir:'muted',vivid:'vivid'};

/* ============================ 3. COLOR + TIME ============================ */
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbHsl([r,g,b]){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; }
  return [h,s,l];
}
function hslRgb([h,s,l]){
  h=((h%360)+360)%360; const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255];
}
function tune(hex,sat=1,light=0,hue=0){ const [h,s,l]=rgbHsl(hexRgb(hex)); return hslRgb([h+hue,Math.min(1,s*sat),Math.max(0,Math.min(1,l+light))]); }
function mixRgb(a,b,t){ return a.map((v,i)=>v+(b[i]-v)*t); }
function rgba(c,a=1){ return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }
function rnd(n){ const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function phaseFor(ov){
  const h=new Date().getHours();
  const key=ov&&ov!=='auto'?ov:(h>=5&&h<8?'dawn':h>=8&&h<17?'day':h>=17&&h<20?'golden':'night');
  return PHASES[key];
}
let GRAIN=null;
function grain(cx){
  if(GRAIN) return GRAIN;
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'), im=g.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){ const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  g.putImageData(im,0,0); GRAIN=cx.createPattern(c,'repeat'); return GRAIN;
}

/* ============================ 4. GENERATIVE MEMORY RENDERER ============================ */
function rainStreaks(cx,w,h,t,sp,seed,count,dx){
  cx.strokeStyle='rgba(255,255,255,0.14)'; cx.lineWidth=1; cx.beginPath();
  for(let i=0;i<count;i++){
    const rx=rnd(seed*13+i)*w, ry=rnd(seed*5+i*2), spd=0.6+rnd(i*9+seed)*0.8;
    const y=((ry+t*sp*spd*2.2)%1)*h, len=10+rnd(i+seed*2)*18;
    cx.moveTo(rx+dx,y); cx.lineTo(rx-len*0.25+dx,y+len);
  }
  cx.stroke();
}
const SCENES={
  horizon(cx,w,h,pal,t,sp,dx,dy,seed){
    for(let k=0;k<3;k++){
      const baseY=h*(0.64+k*0.1)+dy*(0.3+k*0.2), amp=h*(0.05+0.02*k), ph=t*sp*(0.5+k*0.3)+seed+k*2;
      cx.beginPath(); cx.moveTo(0,h);
      for(let x=0;x<=w;x+=w/40) cx.lineTo(x,baseY+Math.sin(x/w*Math.PI*(2+k)+ph)*amp);
      cx.lineTo(w,h); cx.closePath();
      cx.fillStyle=rgba(mixRgb(pal[0],[0,0,0],0.3+k*0.18),0.92-k*0.12); cx.fill();
    }
  },
  rain(cx,w,h,pal,t,sp,dx,dy,seed){
    const pool=cx.createLinearGradient(0,h*0.8,0,h);
    pool.addColorStop(0,rgba(pal[0],0)); pool.addColorStop(1,rgba(pal[0],0.6));
    cx.fillStyle=pool; cx.fillRect(0,h*0.8,w,h*0.2);
    cx.globalCompositeOperation='screen';
    for(let i=0;i<10;i++){
      const x=rnd(seed*11+i)*w+Math.sin(t*sp+i)*w*0.04+dx, y=h*(0.2+0.5*rnd(i+seed)), r=w*(0.03+0.06*rnd(i*3+seed));
      const b=cx.createRadialGradient(x,y,0,x,y,r); b.addColorStop(0,rgba(pal[2],0.5)); b.addColorStop(1,rgba(pal[2],0));
      cx.fillStyle=b; cx.fillRect(x-r,y-r,r*2,r*2);
    }
    cx.globalCompositeOperation='source-over';
    rainStreaks(cx,w,h,t,sp,seed,60,dx*0.2);
  },
  bokeh(cx,w,h,pal,t,sp,dx,dy,seed){
    cx.globalCompositeOperation='screen';
    for(let i=0;i<14;i++){
      const x=rnd(seed*31+i)*w+Math.sin(t*sp*(1+i%3)+i)*w*0.05+dx*(1+(i%4)*0.3);
      const y=rnd(seed*17+i*3)*h+Math.cos(t*sp*0.7+i)*h*0.04+dy*(1+(i%4)*0.3);
      const r=w*(0.05+rnd(i+seed)*0.12);
      const b=cx.createRadialGradient(x,y,0,x,y,r); b.addColorStop(0,rgba(pal[i%3],0.4)); b.addColorStop(1,rgba(pal[i%3],0));
      cx.fillStyle=b; cx.fillRect(x-r,y-r,r*2,r*2);
    }
    cx.globalCompositeOperation='source-over';
  },
  grid(cx,w,h,pal,t,sp,dx,dy){
    const y0=h*0.6+dy*0.2;
    const gg=cx.createLinearGradient(0,y0,0,h); gg.addColorStop(0,rgba(pal[0],0.2)); gg.addColorStop(1,rgba(pal[0],0.95));
    cx.fillStyle=gg; cx.fillRect(0,y0,w,h-y0);
    const sx=w/2+dx*0.5, sy=y0-h*0.1, sun=cx.createRadialGradient(sx,sy,0,sx,sy,h*0.14);
    sun.addColorStop(0,rgba(pal[2],0.9)); sun.addColorStop(1,rgba(pal[2],0));
    cx.fillStyle=sun; cx.fillRect(0,0,w,h);
    cx.strokeStyle=rgba(pal[2],0.45); cx.lineWidth=1;
    for(let i=-8;i<=8;i++){ cx.beginPath(); cx.moveTo(w/2+dx*0.3,y0); cx.lineTo(w/2+i*w*0.16+dx,h); cx.stroke(); }
    cx.strokeStyle=rgba(pal[2],0.35);
    for(let j=0;j<8;j++){ const f=((j+t*sp*2.5)%8)/8, y=y0+(h-y0)*f*f; cx.beginPath(); cx.moveTo(0,y); cx.lineTo(w,y); cx.stroke(); }
  }
};
function drawOverlay(cx,w,h,t,sp,seed,kind){
  if(kind==='fog'){ const g=cx.createLinearGradient(0,h,0,h*0.35); g.addColorStop(0,'rgba(230,236,245,0.42)'); g.addColorStop(1,'rgba(230,236,245,0)'); cx.fillStyle=g; cx.fillRect(0,0,w,h); }
  else if(kind==='golden'){ cx.fillStyle='rgba(255,160,70,0.16)'; cx.fillRect(0,0,w,h); }
  else if(kind==='neon'){ const g=cx.createRadialGradient(w/2,h/2,w*0.2,w/2,h/2,w*0.8); g.addColorStop(0,'rgba(255,0,140,0)'); g.addColorStop(1,'rgba(255,0,140,0.35)'); cx.globalCompositeOperation='screen'; cx.fillStyle=g; cx.fillRect(0,0,w,h); cx.globalCompositeOperation='source-over'; }
  else if(kind==='snow'){ cx.fillStyle='rgba(255,255,255,0.85)'; cx.beginPath(); for(let i=0;i<60;i++){ const y=((rnd(seed*7+i)+t*sp*0.35)%1)*h, x=rnd(seed*3+i*5)*w+Math.sin(t*sp+i)*8; cx.moveTo(x,y); cx.arc(x,y,1.2+rnd(i+seed)*1.8,0,Math.PI*2); } cx.fill(); }
  else if(kind==='rain'){ rainStreaks(cx,w,h,t,sp,seed+3,50,0); }
}
function drawScene(cx,w,h,post,t,o={}){
  const sat=o.sat??1, light=o.light??0, hue=o.hue??0;
  const pal=(o.palette||post.palette||DEFAULT_PAL).map(hx=>tune(hx,sat,light,hue));
  const sp=((o.bpm||90)/90)*(o.mot??1)*(RM?0.25:1)*(state.motion?1:0.15)*0.00014;
  const D=o.depth??1, dx=(o.px||0)*w*0.035*D, dy=(o.py||0)*h*0.035*D;
  const seed=post.id%997||1, ga=cx.globalAlpha;
  cx.globalCompositeOperation='source-over';
  const g=cx.createLinearGradient(0,0,0,h); g.addColorStop(0,rgba(pal[0])); g.addColorStop(1,rgba(pal[1]));
  cx.fillStyle=g; cx.fillRect(0,0,w,h);
  const sx=w*(0.5+0.12*Math.sin(t*sp*0.6))+dx*0.5, sy=h*0.58+dy*0.5;
  const sun=cx.createRadialGradient(sx,sy,0,sx,sy,w*0.75);
  sun.addColorStop(0,rgba(pal[2],0.85)); sun.addColorStop(1,rgba(pal[2],0));
  cx.globalCompositeOperation='screen'; cx.fillStyle=sun; cx.fillRect(0,0,w,h);
  for(let i=0;i<4;i++){
    const a=t*sp*(1+i*0.37)+i*1.7+seed;
    const x=w*(0.5+0.34*Math.sin(a*1.3))+dx*(1+i*0.25), y=h*(0.5+0.28*Math.cos(a))+dy*(1+i*0.25);
    const r=w*(0.32+0.08*Math.sin(a*2)), c=pal[(i%2)+1];
    const bg=cx.createRadialGradient(x,y,0,x,y,r); bg.addColorStop(0,rgba(c,0.45)); bg.addColorStop(1,rgba(c,0));
    cx.fillStyle=bg; cx.fillRect(0,0,w,h);
  }
  cx.globalCompositeOperation='source-over';
  (SCENES[post.scene]||SCENES.bokeh)(cx,w,h,pal,t,sp,dx,dy,seed);
  cx.globalCompositeOperation='source-over';
  if(o.overlay&&o.overlay!=='none') drawOverlay(cx,w,h,t,sp,seed,o.overlay);
  if(o.tintA){ cx.fillStyle=rgba(o.tint,o.tintA); cx.fillRect(0,0,w,h); }
  const vg=cx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.35,w/2,h/2,Math.max(w,h)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.35)');
  cx.fillStyle=vg; cx.fillRect(0,0,w,h);
  cx.globalAlpha=ga*0.06; cx.fillStyle=grain(cx); cx.fillRect(0,0,w,h);
  cx.globalAlpha=ga; cx.globalCompositeOperation='source-over';
}
/* Photo memories: the photo sits in its own depth layer; light, time and ambience are applied over it */
const IMGS=new Map();
function drawPhoto(cx,w,h,p,t,o){
  let im=IMGS.get(p.img);
  if(!im){ im=new Image(); im.src=p.img; IMGS.set(p.img,im); }
  if(!im.complete||!im.naturalWidth){ drawScene(cx,w,h,p,t,o); return; }
  const s=Math.max(w/im.naturalWidth,h/im.naturalHeight)*1.04, dw=im.naturalWidth*s, dh=im.naturalHeight*s;
  const D=o.depth??1;
  cx.drawImage(im,(w-dw)/2+(o.px||0)*w*0.012*D,(h-dh)/2+(o.py||0)*h*0.012*D,dw,dh);
  if(o.tintA){ cx.fillStyle=rgba(o.tint,o.tintA); cx.fillRect(0,0,w,h); }
  const g=cx.createLinearGradient(0,h*0.55,0,h); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.45)');
  cx.fillStyle=g; cx.fillRect(0,0,w,h);
  if(o.overlay&&o.overlay!=='none') drawOverlay(cx,w,h,t,((o.bpm||90)/90)*0.00014,p.id%997,o.overlay);
}
const paint=(cx,w,h,p,t,o)=>p.img?drawPhoto(cx,w,h,p,t,o):drawScene(cx,w,h,p,t,o);

let tilt={x:0,y:0,tx:0,ty:0};
function cardOpts(p){
  const a=adaptOf(p.id), s=SOUNDS[state.sound], m=MOODS[state.mood], ph=phaseFor(a.light);
  return {bpm:s.bpm, sat:m.sat, light:m.light+ph.light, hue:s.hue, depth:a.depth*m.depth,
          px:tilt.x, py:tilt.y, tint:ph.tint, tintA:ph.a, overlay:a.ambient};
}
let storyIdx=0, storyNudge={song:null, atmo:null}, storyTimer=0;
function storyOpts(s){
  const o=cardOpts(P(s.post));
  if(storyNudge.song){ o.bpm=SONGS[storyNudge.song].bpm; o.hue=SONGS[storyNudge.song].hue; }
  if(storyNudge.atmo) o.overlay=storyNudge.atmo;
  return o;
}

/* Canvas registry: only visible canvases are redrawn */
const registry=new Map();
const io=new IntersectionObserver(es=>es.forEach(e=>{ const r=registry.get(e.target); if(r) r.visible=e.isIntersecting; }),{rootMargin:'120px'});
function makeDrawer(cv){
  const d=cv.dataset;
  if(d.draw==='card'||d.draw==='thumb'){
    const p=P(d.id); if(!p) return ()=>{};
    const depthBoost=d.draw==='thumb'?0.5:1;
    return (cx,w,h,t)=>{ const o=cardOpts(p); if(depthBoost!==1) o.depth=depthBoost; paint(cx,w,h,p,t,o); };
  }
  if(d.draw==='story'){ return (cx,w,h,t)=>{ const s=STORIES[storyIdx]; if(s) paint(cx,w,h,P(s.post),t,storyOpts(s)); }; }
  return ()=>{};
}
function mount(root){
  $$('canvas[data-draw]',root).forEach(cv=>{
    if(registry.has(cv)) return;
    registry.set(cv,{visible:true, fn:cv._draw||makeDrawer(cv)});
    io.observe(cv);
  });
}
const dpr=Math.min(window.devicePixelRatio||1,1.5);
function loop(t){
  tilt.x+=(tilt.tx-tilt.x)*0.05; tilt.y+=(tilt.ty-tilt.y)*0.05;
  for(const [cv,r] of registry){
    if(!cv.isConnected){ registry.delete(cv); io.unobserve(cv); continue; }
    if(!r.visible) continue;
    const W=Math.max(2,Math.round(cv.clientWidth*dpr)), H=Math.max(2,Math.round(cv.clientHeight*dpr));
    if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
    r.fn(cv.getContext('2d'),W,H,t);
  }
  requestAnimationFrame(loop);
}
addEventListener('pointermove',e=>{ tilt.tx=e.clientX/innerWidth*2-1; tilt.ty=e.clientY/innerHeight*2-1; },{passive:true});
addEventListener('deviceorientation',e=>{ if(e.gamma==null) return; tilt.tx=Math.max(-1,Math.min(1,e.gamma/30)); tilt.ty=Math.max(-1,Math.min(1,(e.beta-45)/30)); });

function renderAuth(err){
  const el=$('#auth');
  el.innerHTML=authHTML()+`<p class="auth-err">${esc(err||'')}</p>`;
  $$('[data-int]',el).forEach(b=>b.onclick=()=>{
    const k=b.dataset.int, list=AUTH.d.interests;
    if(list.includes(k)) list.splice(list.indexOf(k),1); else list.push(k);

function readAuthInputs(){ $$('[data-f]').forEach(i=>{ AUTH.d[i.dataset.f]=i.dataset.f==='password'?i.value:i.value.trim(); }); }
function ageOk(dob){
  if(!dob) return false; const b=new Date(dob), n=new Date();
  let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth();
  if(m<0||(m===0&&n.getDate()<b.getDate())) a--;
  return a>=13 && a<120;
}
async function authClick(e){
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if(a==='start'){ AUTH.step='signup1'; renderAuth(); return; }
  if(a==='login'){ AUTH.step='login'; renderAuth(); return; }
  if(a==='back'){ AUTH.step=BACK[AUTH.step]||'welcome'; renderAuth(); return; }
  readAuthInputs();
  const d=AUTH.d;
  if(a==='next'){
    if(!d.name||d.name.length<2) return renderAuth('Add your name.');
    if(!/^[a-z0-9._]{3,20}$/i.test(d.handle||'')) return renderAuth('Username must be 3–20 letters, numbers, dots or underscores.');
    if(accounts().some(x=>x.handle.toLowerCase()===d.handle.toLowerCase())) return renderAuth('That username is taken.');
    if(!/^\S+@\S+\.\S+$/.test(d.email||'')) return renderAuth('Enter a valid email.');
    if(accounts().some(x=>x.email===d.email.toLowerCase())) return renderAuth('An account with that email already exists. Log in instead.');
    if((d.password||'').length<8) return renderAuth('Password needs at least 8 characters.');
    d.handle=d.handle.toLowerCase();
    AUTH.step='signup2'; renderAuth(); return;
  }
  if(a==='create'){
    if(!ageOk(d.dob)) return renderAuth('You must be at least 13 to use Aether.');
    if(d.interests.length<2) return renderAuth('Pick at least two interests.');
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    const acc={id:'u'+Date.now().toString(36), name:d.name, handle:d.handle, city:d.city||'', email:d.email.toLowerCase(),
      salt, pw:await hashPw(d.password,salt), interests:[...d.interests], created:Date.now()};
    saveAccounts([...accounts(), acc]);
    localStorage.setItem(SESSION_KEY, acc.id);
    user=acc; state=DEFAULT(); state.taste=Object.fromEntries(acc.interests.map(i=>[i,2]));
    save(); AUTH.d={interests:[]}; AUTH.step='welcome';
    enterApp(); toast(`Welcome, ${acc.name}. Your canvas is ready.`);
    return;
  }
  if(a==='signin'){
    const acc=accounts().find(x=>x.email===(d.email||'').toLowerCase());
    if(!acc) return renderAuth('No account with that email.');
    if(await hashPw(d.password||'',acc.salt)!==acc.pw) return renderAuth('Wrong password.');
    localStorage.setItem(SESSION_KEY, acc.id);
    user=acc; try{ state={...DEFAULT(),...JSON.parse(localStorage.getItem('aether.data.'+acc.id)||'{}')}; }catch(e){ state=DEFAULT(); }
    AUTH.d={interests:[]}; AUTH.step='welcome';
    enterApp(); return;
  }
}

  syncContent(); applyTheme();
  $('#auth').hidden=true; $('#auth').innerHTML='';
  setTab('feed');
}

  localStorage.removeItem(SESSION_KEY); user=null; state=DEFAULT(); syncContent();

}

function taste(p){ return p.tags.reduce((s,t)=>s+(state.taste[t]||0),0)/6; }
function rankPosts(){
  const I=state.intent;
  const score=p=>{
    let s=taste(p)+p.craft*(I==='craft'?2.5:1);
    if(I==='calm') s+=(p.mood==='calm'||p.mood==='dreamy')?1.5:(p.mood==='moody'||p.mood==='bright')?-0.5:0;
    if(I==='friends') s+=p.friend?3:-1;
    return s;
  };
  return [...POSTS].sort((a,b)=>score(b)-score(a));
}
function ambientLabel(id){
  const a=adaptOf(id), ph=phaseFor(a.light);
  return `${MOODS[state.mood].label} · ${SOUNDS[state.sound].label} · ${ph.name}${a.ambient!=='none'?' · '+a.ambient:''}`;
}

const MODES=['words','mood','aesthetic','voice','sketch'];

const SEARCH={mode:'words', mood:null, aest:null, sk:[], color:'#ff8a3d'};
function openSearch(){

function searchBody(){

function listenSearch(){
  if(!SR){ toast('Voice search needs speech recognition'); return; }
  const r=new SR(); r.lang='en-US'; r.interimResults=false;
  $('#sVoice')?.classList.add('live');
  r.onresult=e=>{ $('#sq').value=e.results[0][0].transcript; runSearch(); };

function bindSketch(){
  const cv=$('#sk'), cx=cv.getContext('2d'); cx.lineCap='round'; cx.lineWidth=7;
  let drawing=false, last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
  cv.addEventListener('pointerdown',e=>{ drawing=true; cv.setPointerCapture(e.pointerId); last=pos(e); });
  cv.addEventListener('pointermove',e=>{
    if(!drawing) return; const p=pos(e);
    cx.strokeStyle=SEARCH.color; cx.beginPath(); cx.moveTo(last[0]*cv.width,last[1]*cv.height); cx.lineTo(p[0]*cv.width,p[1]*cv.height); cx.stroke();
    SEARCH.sk.push(p); last=p;
  });
  cv.addEventListener('pointerup',()=>{ drawing=false; runSearch(); });
  $$('.sw-c').forEach(b=>b.onclick=()=>{ SEARCH.color=b.dataset.hex; $$('.sw-c').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#skClear').onclick=()=>{ SEARCH.sk=[]; cx.clearRect(0,0,cv.width,cv.height); runSearch(); };
}
function runSearch(){
  const sres=$('#sres'); if(!sres) return;
  if(!ALL.length){ sres.innerHTML='<div class="empty glass"><h3>Nothing to search yet</h3><p>Search covers memories on Aether. Create one, and it becomes findable by mood, aesthetic, voice or sketch.</p></div>'; return; }
  const q=($('#sq')?.value||'').trim().toLowerCase(), toks=q.split(/\s+/).filter(Boolean);
  let list;
  if(SEARCH.mode==='sketch'){
    if(SEARCH.sk.length<8){ sres.innerHTML='<p class="muted small">Draw a quick shape. Color and composition are matched against your memories.</p>'; return; }
    const pts=SEARCH.sk, hsl=rgbHsl(hexRgb(SEARCH.color));
    const cy=pts.reduce((s,p)=>s+p[1],0)/pts.length, label=SWATCH.find(s=>s.hex===SEARCH.color).k;
    list=ALL.map(p=>{
      const pl=p.palette.reduce((s,hx)=>s+rgbHsl(hexRgb(hx))[2],0)/p.palette.length;
      const ph=rgbHsl(hexRgb(p.palette[2]))[0];
      const dh=Math.min(Math.abs(ph-hsl[0]),360-Math.abs(ph-hsl[0]))/180;
      const comp=(cy>0.55&&p.scene==='horizon')||(cy<0.45&&(p.scene==='rain'||p.scene==='bokeh'))?0.3:0;
      return {p, s:1-(0.6*dh+0.4*Math.abs(pl-hsl[2]))+comp, r:`color ${label} · ${Math.round(Math.max(0,1-dh)*100)}% hue match${comp?' · composition match':''}`};
    });
  } else {
    list=ALL.map(p=>{
      const hay=[p.title,p.place,p.author,p.mood,...p.tags].join(' ').toLowerCase();
      const hits=toks.filter(t=>hay.includes(t));
      let s=hits.length*2, r=hits.length?`matched “${hits.join('”, “')}”`:'';
      if(SEARCH.mood){ if(p.mood!==SEARCH.mood) return {p,s:-1}; s+=3; r=(r?r+' · ':'')+`mood: ${p.mood}`; }
      if(SEARCH.aest){ if(!p.tags.includes(SEARCH.aest)) return {p,s:-1}; s+=3; r=(r?r+' · ':'')+`aesthetic: ${SEARCH.aest}`; }
      if(!toks.length&&!SEARCH.mood&&!SEARCH.aest) return {p,s:p.craft,r:`high craft · ${Math.round(p.craft*100)}`};
      return {p,s,r};
    });
  }
  list=list.filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
  sres.innerHTML=list.length
    ? list.map(x=>`<div class="res"><div class="tile-sm"><canvas data-draw="card" data-id="${x.p.id}"></canvas></div>
        <div><b>${esc(x.p.title)}</b><div class="muted small">@${esc(x.p.author)} · ${esc(x.p.place||'')}</div><div class="why-s">${x.r}</div></div></div>`).join('')
    : '<p class="muted small">No memories matched. Try a mood, an aesthetic, or sketch a color.</p>';
  mount(sres);
}

/* ============================ 11. CAMERA + NEURAL LENS ============================ */
const LOOKS={
  film:{f:'sepia(.22) contrast(1.08) saturate(.85)', o:[[255,205,150,.10]], grain:true, label:'35mm film'},
  tokyo:{f:'hue-rotate(-12deg) saturate(1.25) contrast(1.05)', o:[[255,40,160,.14],[40,220,255,.10]], neon:true, label:'Tokyo'},
  night:{f:'brightness(.72) contrast(1.1)', o:[[30,50,140,.30]], vig:true, label:'Night'},
  winter:{f:'saturate(.6) brightness(1.06)', o:[[200,225,255,.18]], label:'Winter'},
  autumn:{f:'sepia(.35) hue-rotate(-8deg) saturate(1.2)', o:[[255,140,40,.12]], label:'Autumn'},
  spring:{f:'saturate(1.15) brightness(1.05)', o:[[255,170,210,.12]], label:'Spring'},
  summer:{f:'saturate(1.3) brightness(1.06)', o:[[255,220,120,.10]], label:'Summer'},
  golden:{f:'sepia(.15) saturate(1.2)', o:[[255,150,60,.20]], label:'Golden hour'},
  noir:{f:'grayscale(1) contrast(1.2)', o:[], label:'Noir'},
  vivid:{f:'saturate(1.5) contrast(1.1)', o:[], label:'Vivid'}
};
const SEASONS=['winter','autumn','spring','summer','golden'];
const LOOK_CHIPS=[['film','35mm'],['tokyo','Tokyo'],['night','Night'],['winter','Winter'],['autumn','Autumn'],['spring','Spring'],['summer','Summer'],['golden','Golden'],['noir','Noir'],['vivid','Vivid'],['expand','Expand']];
const SAMPLE_CMDS=['Make this 35mm film in Tokyo at night','Winter, snow light','Golden hour, warm','Expand the frame','Original'];
const CAM={active:false,cv:null,cx:null,video:null,stream:null,raf:0,looks:new Set(),expand:false,rec:null,chunks:[],recording:false,recT0:0,recIv:0,holdT:0,capOffset:0};
const CAM_SCENE={id:0, scene:'grid', palette:['#0b0f2a','#2b1456','#ff3d9a']};

function renderCam(){
  $('#v-cam').innerHTML=`<div class="cam">
    <div class="vf">
      <canvas id="camCv"></canvas>
      <div class="look-row" id="lookRow"></div>
      <div class="rec" id="recLbl" hidden>REC 0:00</div>
      <div class="cam-note" id="camNote"></div>
      <div class="understood glass" id="under" hidden></div>

    </div>
    <div class="cam-bottom">
      <button class="round" id="cVoice" aria-label="Voice command">${svg('mic',22)}</button>
      <button class="shutter" id="cShutter" aria-label="Capture, or hold to record"><span></span></button>
      <button class="round" id="cExpand" aria-label="Expand frame">${svg('expand',22)}</button>
    </div>
    <div class="cam-hint">Tap to capture · hold to record · say “Make this look like 35mm film in Tokyo at night”</div>
  </div>`;
  renderLookRow();
  $('#cVoice').onclick=voiceCmd;
  $('#cExpand').onclick=()=>{ CAM.expand=!CAM.expand; renderLookRow(); toast(CAM.expand?'Frame expanded (edge extension)':'Frame restored'); };
  const sh=$('#cShutter');
  sh.addEventListener('pointerdown',e=>{ sh.setPointerCapture(e.pointerId); CAM.holdT=setTimeout(startRec,350); });
  sh.addEventListener('pointerup',()=>{ clearTimeout(CAM.holdT); if(CAM.recording) stopRec(); else takePhoto(); });
  sh.addEventListener('pointercancel',()=>clearTimeout(CAM.holdT));
  startCam();
}
function renderLookRow(){
  const row=$('#lookRow'); if(!row) return;
  row.innerHTML=LOOK_CHIPS.map(([k,l])=>`<button class="chip ${(k==='expand'?CAM.expand:CAM.looks.has(k))?'on':''}" data-look="${k}">${l}</button>`).join('');
  $$('[data-look]',row).forEach(b=>b.onclick=()=>{
    const k=b.dataset.look;
    if(k==='expand') CAM.expand=!CAM.expand;
    else if(CAM.looks.has(k)) CAM.looks.delete(k);
    else { if(SEASONS.includes(k)) SEASONS.forEach(s=>CAM.looks.delete(s)); CAM.looks.add(k); }
    renderLookRow();
  });
}
function showUnderstood(parts){
  const u=$('#under'); if(!u) return;
  u.hidden=false; u.innerHTML=`<b>Understood</b> · ${parts.join(' · ')}<small>Applied live to the viewfinder. Say “original” to undo.</small>`;
  clearTimeout(u._t); u._t=setTimeout(()=>{ u.hidden=true; },6500);
}
const RULES=[[/35\s?mm|film/,'film'],[/tokyo/,'tokyo'],[/night|midnight/,'night'],[/winter|snow/,'winter'],[/autumn|\bfall\b/,'autumn'],[/spring/,'spring'],[/summer/,'summer'],[/golden|sunset/,'golden'],[/noir|black and white/,'noir'],[/vivid|bright|colou?r pop/,'vivid']];
function applyCommand(text){
  const t=String(text).toLowerCase(), found=[];
  if(/reset|original|clear|normal/.test(t)){ CAM.looks.clear(); CAM.expand=false; found.push('original'); }
  for(const [re,key] of RULES){
    if(re.test(t)){ if(SEASONS.includes(key)) SEASONS.forEach(s=>CAM.looks.delete(s)); CAM.looks.add(key); found.push(LOOKS[key].label); }
  }
  if(/expand|outpaint|wider|extend|bigger frame/.test(t)){ CAM.expand=true; found.push('expanded frame'); }
  if(!found.length){ toast('Did not catch a look. Try “35mm film” or “Tokyo at night”.'); return; }
  renderLookRow(); showUnderstood(found);
}
function voiceCmd(){
  if(!SR){
    openSheet(`<div class="grab"></div><h2>Tell the lens</h2>
      <p class="muted small">Speech recognition is not available in this browser. Type the command instead. Same parser, same result.</p>
      <input class="txt" id="cmdIn" placeholder="Make this look like 35mm film in Tokyo at night" autocomplete="off">
      <div class="chipset">${SAMPLE_CMDS.map(c=>`<button class="chip" data-cmd="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <button class="btn" id="cmdGo">Apply</button>`,()=>{
      $$('[data-cmd]').forEach(b=>b.onclick=()=>{ applyCommand(b.dataset.cmd); closeSheet(); });
      $('#cmdGo').onclick=()=>{ applyCommand($('#cmdIn').value); closeSheet(); };
      $('#cmdIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ applyCommand(e.target.value); closeSheet(); } });
    });
    return;
  }
  const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
  r.onresult=e=>applyCommand(e.results[0][0].transcript);
  r.onerror=()=>toast('Did not hear that. Try again.');
  r.onend=()=>$('#cVoice')?.classList.remove('live');
  $('#cVoice').classList.add('live'); r.start();
}
function startCam(){
  CAM.active=true; CAM.cv=$('#camCv'); CAM.cx=CAM.cv.getContext('2d');
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(s=>{
      if(!CAM.active){ s.getTracks().forEach(t=>t.stop()); return; }
      CAM.stream=s; const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.srcObject=s; v.play().catch(()=>{});
      CAM.video=v; const n=$('#camNote'); if(n) n.textContent='';
    }).catch(()=>{ const n=$('#camNote'); if(n) n.textContent='Camera permission was not granted. Showing a generated scene so you can still try the Neural Lens.'; });
  } else { const n=$('#camNote'); if(n) n.textContent='No camera API in this browser. Showing a generated scene.'; }
  cancelAnimationFrame(CAM.raf); CAM.raf=requestAnimationFrame(camLoop);
}
function stopCam(){
  CAM.active=false; cancelAnimationFrame(CAM.raf);
  if(CAM.recording){ try{ CAM.rec.stop(); }catch(e){} CAM.recording=false; }
  if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; }
  CAM.video=null; clearInterval(CAM.recIv);
}
function lookFilter(){
  const f=[], o=[], flags={grain:false,neon:false,vig:false};
  CAM.looks.forEach(k=>{ const L=LOOKS[k]; f.push(L.f); o.push(...L.o); if(L.grain) flags.grain=true; if(L.neon) flags.neon=true; if(L.vig) flags.vig=true; });
  return {filter:f.join(' ')||'none', overlays:o, ...flags};
}
function drawSource(cx,x,y,w,h,t){
  if(CAM.video&&CAM.video.readyState>=2){
    const vw=CAM.video.videoWidth, vh=CAM.video.videoHeight, s=Math.max(w/vw,h/vh), dw=vw*s, dh=vh*s;
    cx.drawImage(CAM.video,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  } else {
    cx.save(); cx.translate(x,y); drawScene(cx,w,h,CAM_SCENE,t,{bpm:100,px:tilt.x,py:tilt.y,depth:1}); cx.restore();
  }
}
function camLoop(t){
  if(!CAM.active||!CAM.cv||!CAM.cv.isConnected) return;
  const cv=CAM.cv, cx=CAM.cx, d=Math.min(devicePixelRatio||1,1.5);
  const W=Math.max(2,Math.round(cv.clientWidth*d)), H=Math.max(2,Math.round(cv.clientHeight*d));
  if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
  const f=lookFilter();
  cx.setTransform(1,0,0,1,0,0);
  if(CAM.expand){
    cx.filter=('blur(22px) brightness(.85) '+f.filter).trim(); drawSource(cx,0,0,W,H,t);
    cx.filter=f.filter; drawSource(cx,W*0.1,H*0.1,W*0.8,H*0.8,t);
  } else { cx.filter=f.filter; drawSource(cx,0,0,W,H,t); }
  cx.filter='none';
  f.overlays.forEach(([r,g,b,a])=>{ cx.fillStyle=`rgba(${r},${g},${b},${a})`; cx.fillRect(0,0,W,H); });
  if(f.neon){ const g=cx.createRadialGradient(W/2,H/2,W*0.2,W/2,H/2,W*0.8); g.addColorStop(0,'rgba(255,0,140,0)'); g.addColorStop(1,'rgba(255,0,140,0.30)'); cx.globalCompositeOperation='screen'; cx.fillStyle=g; cx.fillRect(0,0,W,H); cx.globalCompositeOperation='source-over'; }
  if(f.vig||CAM.expand){ const g=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.4)'); cx.fillStyle=g; cx.fillRect(0,0,W,H); }
  if(f.grain){ cx.globalAlpha=0.07; cx.fillStyle=grain(cx); cx.fillRect(0,0,W,H); cx.globalAlpha=1; }
  CAM.raf=requestAnimationFrame(camLoop);
}
/* Save a still as a data URL (persists in this browser), downscaled to keep storage small */
function frameDataURL(maxW=540){
  const src=CAM.cv, s=Math.min(1,maxW/src.width), c=document.createElement('canvas');
  c.width=Math.round(src.width*s); c.height=Math.round(src.height*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.8);
}
function takePhoto(){
  const url=frameDataURL();
  const f=$('#flash'); if(f){ f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  openCoCreate({type:'photo', url});
}
function startRec(){
  if(!CAM.cv.captureStream||!window.MediaRecorder){ toast('Video recording is not supported in this browser'); return; }
  CAM.recording=true; CAM.chunks=[]; CAM.recT0=Date.now();
  const stream=CAM.cv.captureStream(30);
  const mime=(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('video/webm'))?'video/webm':'';
  CAM.rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  CAM.rec.ondataavailable=e=>{ if(e.data&&e.data.size) CAM.chunks.push(e.data); };
  CAM.rec.onstop=()=>{
    const blob=new Blob(CAM.chunks,{type:CAM.rec.mimeType||'video/webm'});
    openCoCreate({type:'video', url:URL.createObjectURL(blob)});
  };
  CAM.rec.start(250);
  $('#cShutter').classList.add('rec'); $('#recLbl').hidden=false;
  CAM.recIv=setInterval(()=>{ const s=Math.floor((Date.now()-CAM.recT0)/1000); $('#recLbl').textContent=`REC 0:${String(s).padStart(2,'0')}`; },250);
}
function stopRec(){
  CAM.recording=false; clearInterval(CAM.recIv);
  $('#cShutter').classList.remove('rec'); $('#recLbl').hidden=true;
  try{ CAM.rec.stop(); }catch(e){}
}

/* Digital Twin / Co-creator */
function captionPool(){
  const place=CAM.looks.has('tokyo')?'tokyo':'this light';
  const h=new Date().getHours();
  const when=CAM.looks.has('night')?'at night':(h>=17&&h<20?'at golden hour':h<12?'this morning':'this afternoon');
  const look=[...CAM.looks].map(k=>LOOKS[k].label.toLowerCase())[0]||'unfiltered';
  const season=[...CAM.looks].find(k=>SEASONS.includes(k));
  return [
    `${place} ${when}, still holding the light.`,
    `a little ${look} and a lot of quiet.`,
    'kept this one for the slow version of today.',
    season?`the ${LOOKS[season].label.toLowerCase()} came in soft.`:'nothing urgent, just this.',
    `${place} · ${look}`,
    'small frame, big afternoon.'
  ];
}
function openCoCreate(media){
  const pool=captionPool(), start=CAM.capOffset%pool.length;
  const caps=[0,1,2].map(i=>pool[(start+i)%pool.length]);
  const look=[...CAM.looks].map(k=>LOOKS[k].label)[0]||'Original';
  const preview=media.type==='video'?`<video src="${media.url}" autoplay loop muted playsinline></video>`:`<img src="${media.url}" alt="Your captured memory">`;
  openSheet(`<div class="grab"></div><h2>Co-create</h2>
    <div class="cc-prev">${preview}</div>
    <div class="seg mini" style="padding-left:0;padding-right:0"><button class="on" data-cc="cap">Caption</button><button data-cc="poll">Poll</button><button data-cc="beat">Beat edit</button></div>
    <div id="ccBody"></div>
    <button class="btn" id="ccPub">Publish to your canvas</button>
    <button class="btn ghost" id="ccDrop">Discard</button>`,()=>{
    const body=$('#ccBody');
    const show=tabName=>{
      $$('[data-cc]').forEach(b=>b.classList.toggle('on',b.dataset.cc===tabName));
      if(tabName==='cap'){
        body.innerHTML=`<div class="cc-note">Drafted in your voice. Your voice model is ${state.twin>0?'learning from your captions':'empty until you publish your first caption'}. Lowercase, short lines by default.</div>
          ${caps.map((c,i)=>`<button class="opt ${i===0?'on':''}" data-capopt="${esc(c)}"><span>Option ${i+1}</span><b>${esc(c)}</b></button>`).join('')}
          <input class="txt" id="capIn" value="${esc(caps[0])}">
          <button class="chip" id="capRe" style="margin-top:10px">Regenerate</button>`;
        $$('[data-capopt]').forEach(b=>b.onclick=()=>{ $('#capIn').value=b.dataset.capopt; $$('[data-capopt]').forEach(x=>x.classList.toggle('on',x===b)); });
        $('#capRe').onclick=()=>{ CAM.capOffset++; openCoCreate(media); };
      } else if(tabName==='poll'){
        body.innerHTML=`<div class="cc-note">Suggested poll · built from this frame's look and time of day. Polls appear as a sticker on your story.</div>
          <input class="txt" id="pollQ" value="Which version should keep this memory?">
          <div style="margin-top:10px;display:grid;gap:8px">
            <input class="txt" value="${esc(look)}"><input class="txt" value="Original"><input class="txt" value="Quieter, warmer">
          </div>`;
      } else {
        const bpm=SOUNDS[state.sound].bpm, pattern=[4,2,2,4,2,4,2,2], n=6;
        let t=0; const cuts=[];
        for(let i=0;i<n;i++){ const b=pattern[i%pattern.length], d=b*60/bpm; cuts.push({start:t,beats:b}); t+=d; }
        body.innerHTML=`<div class="cc-note">Beat grid at <b>${bpm} bpm</b> from your Atmosphere choice · cuts snap to bars · phrase = 8 bars</div>
          <div class="beat-tl">${cuts.map((c,i)=>`<i data-beat="${i}" style="flex:${c.beats}"></i>`).join('')}</div>
          <div class="cut-list">${cuts.map(c=>`<span>${c.start.toFixed(1)}s · ${c.beats}b</span>`).join('')}</div>
          <button class="btn ghost" id="metro">${metroId?'Stop beat':'Play beat'}</button>
          <p class="cc-note">Production runs beat tracking on the real audio track. The prototype uses the BPM you chose.</p>`;
        $('#metro').onclick=toggleMetro;
      }
    };
    $$('[data-cc]').forEach(b=>b.onclick=()=>show(b.dataset.cc));
    show('cap');
    $('#ccPub').onclick=()=>{
      const caption=($('#capIn')?.value||'').trim()||'untitled memory';
      publishPost(media,caption,look);
    };
    $('#ccDrop').onclick=()=>closeSheet();
  });
}
function publishPost(media,caption,look){
  const tags=[...CAM.looks].map(k=>LOOK_TAGS[k]).filter(Boolean);
  const p={
    id:Date.now(), author:user.handle, place:user.city||'', title:caption.slice(0,80),
    mood:state.mood, tags:tags.length?[...new Set(tags)]:['minimal'], craft:.8, friend:false,
    scene:CAM.looks.has('tokyo')||CAM.looks.has('night')?'grid':'horizon',
    palette:CAM.looks.has('tokyo')?CAM_SCENE.palette:DEFAULT_PAL,
    img:media.type==='photo'?media.url:null, vid:media.type==='video'?media.url:null, mine:true
  };
  state.posts.unshift(p);
  state.twin=Math.min(100,state.twin+5);
  save(); syncContent();
  closeSheet();
  setTab('feed');
  toast(media.type==='video'?'Published (video lives in this session only)':'Published to your canvas');
}
let metroId=null, audioCtx=null;
function tick(i){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(), now=audioCtx.currentTime;
    o.frequency.value=i%4===0?1320:880; g.gain.setValueAtTime(.14,now); g.gain.exponentialRampToValueAtTime(.001,now+.09);
    o.connect(g).connect(audioCtx.destination); o.start(now); o.stop(now+.1);
  }catch(e){}
  $$('.beat-tl i').forEach((el,k)=>el.classList.toggle('hit',k===(i%6)));
}
function toggleMetro(){
  if(metroId){ clearInterval(metroId); metroId=null; $('#metro').textContent='Play beat'; $$('.beat-tl i').forEach(i=>i.classList.remove('hit')); return; }
  let i=0; tick(i);
  metroId=setInterval(()=>{ i++; tick(i); },60000/SOUNDS[state.sound].bpm);
  $('#metro').textContent='Stop beat';
}

/* ============================ 12. REMIX ============================ */
function promptOverlay(p){
  p=(p||'').toLowerCase();
  if(/rain/.test(p)) return 'rain';
  if(/night|neon/.test(p)) return 'neon';
  if(/golden|warm/.test(p)) return 'golden';
  if(/snow|winter/.test(p)) return 'snow';
  if(/fog|mist/.test(p)) return 'fog';
  return 'none';
}
function openRemix(id){
  const A=P(id), others=POSTS.filter(p=>p.id!==A.id);
  if(!others.length){
    openSheet(`<div class="grab"></div><h2>Remix needs two moments</h2>
      <p class="muted small">A remix merges your memory with a friend's. Nobody has joined yet, so there is no second moment to merge with. Invite someone, and their first memory can be remixed with yours.</p>
      <button class="btn" data-x="inv">Copy invite link</button><button class="btn ghost" data-x="ok">Got it</button>`,()=>{
      $('[data-x=inv]').onclick=inviteLink; $('[data-x=ok]').onclick=closeSheet;
    });
    return;
  }
  openSheet(`<div class="grab"></div><h2>Remix</h2>
    <p class="muted small">Pick a second moment. Aether blends light, palette and composition into one shared memory, credited to both of you.</p>
    <div class="pick" style="margin-top:10px">${others.map(p=>`<button class="opt" data-pick="${p.id}"><b>${esc(p.title)}</b><span>@${esc(p.author)}</span></button>`).join('')}</div>
    <input class="txt" id="rmPrompt" placeholder="Describe the merge (optional)" autocomplete="off">
    <div class="chipset">${['keep the horizon, add night rain','blend both palettes, golden','make it a 1990s postcard'].map(s=>`<button class="chip" data-sugg="${s}">${s}</button>`).join('')}</div>
    <button class="btn" id="rmGo">Merge memories</button>
    <div id="rmOut"></div>`,()=>{
    let sel=null;
    $$('[data-pick]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.pick; $$('[data-pick]').forEach(x=>x.classList.toggle('on',x===b)); });
    $$('[data-sugg]').forEach(b=>b.onclick=()=>{ $('#rmPrompt').value=b.dataset.sugg; });
    $('#rmGo').onclick=()=>{
      if(!sel){ toast('Pick a second moment first'); return; }
      const B=P(sel), prompt=$('#rmPrompt').value.trim(), out=$('#rmOut');
      const steps=['Aligning horizons','Blending light across both moments','Writing a shared caption'];
      let k=0;
      const run=()=>{
        out.innerHTML=`<div class="steps">${steps[k]}…<div class="bar"><i style="width:${Math.round((k+1)/steps.length*100)}%"></i></div></div>`;
        k++; if(k<=steps.length) setTimeout(run,900); else showMix(A,B,prompt);
      };
      run();
    };
  });
}
function showMix(A,B,prompt){
  const out=$('#rmOut'), ov=promptOverlay(prompt);
  const base={bpm:90,sat:1,light:0,hue:0,depth:1,tint:[255,255,240],tintA:.03,overlay:ov};
  out.innerHTML=`<div class="mix"><canvas></canvas></div>
    <p class="muted small" style="margin-top:10px">Shared memory · @you × @${esc(B.author)} · prompt read as: <b>${ov==='none'?'composition only':ov}</b></p>
    <button class="btn" id="rmPub">Invite @${esc(B.author)} to co-sign</button>`;
  const cv=out.querySelector('canvas');
  cv._draw=(cx,w,h,t)=>{
    const k=0.5+0.5*Math.sin(t*0.0007);
    paint(cx,w,h,A,t,{...base,px:tilt.x,py:tilt.y});
    cx.globalAlpha=0.3+0.4*k;
    paint(cx,w,h,B,t,{...base,px:tilt.x,py:tilt.y});
    cx.globalAlpha=1;
  };
  mount(out);
  $('#rmPub').onclick=()=>{ closeSheet(); toast(`Invite prepared for @${B.author}. Nothing is sent until they join.`); };
}

/* ============================ 13. DIRECT ============================ */
let dmOpen=null, dmRec=null;
function lastPreview(t){
  const m=t.msgs[t.msgs.length-1];
  if(!m) return 'Only you can see this. Start a note.';
  if(m.t==='memory') return 'saved a memory';
  if(m.t==='voice') return `voice note · 0:${String(m.d).padStart(2,'0')}`;
  return m.v;
}
function bubble(m){
  const me=m.f==='me'?'me':'them';
  if(m.t==='memory'){ const p=P(m.pid); if(!p) return ''; return `<div class="b mem ${me}"><div class="tile-sm"><canvas data-draw="thumb" data-id="${p.id}"></canvas></div><span>${esc(p.title)}</span></div>`; }
  if(m.t==='voice') return `<div class="b voice ${me}">${[...Array(18)].map((_,i)=>`<i style="height:${6+Math.round(rnd(i*7+m.d)*16)}px"></i>`).join('')}<span>0:${String(m.d).padStart(2,'0')}</span></div>`;
  return `<div class="b ${me}">${esc(m.v)}</div>`;
}
function renderDM(){
  const root=$('#v-dm');
  if(!dmOpen){
    root.innerHTML=`<div class="topbar"><div class="wordmark sm">direct</div></div>
      ${THREADS.map(t=>`<button class="thread" data-th="${t.id}">
        <span class="av lg" style="background:${t.color}">${t.name[0].toUpperCase()}</span>
        <span class="tx"><b>${esc(t.name)}</b><span class="muted">${esc(lastPreview(t))}</span></span></button>`).join('')}
      <div class="empty glass" style="margin-top:14px">
        <h3>No conversations yet</h3>
        <p>Direct messages open with people who follow you back, or with your own notes. Share a memory to yourself to start.</p>
        <button class="btn ghost" data-invite>Copy invite link</button>
      </div>`;
    $$('[data-th]',root).forEach(b=>b.onclick=()=>{ dmOpen=b.dataset.th; renderDM(); });
    $$('[data-invite]',root).forEach(b=>b.onclick=inviteLink);
    return;
  }
  const th=THREADS.find(x=>x.id===dmOpen);
  root.innerHTML=`<div class="chat">
    <div class="chat-h"><button class="icon" id="dmBack" aria-label="Back">${svg('back',20)}</button>
      <span class="av" style="background:${th.color}">${th.name[0].toUpperCase()}</span><b>${esc(th.name)}</b></div>
    <div class="msgs" id="msgs">${th.msgs.length?th.msgs.map(bubble).join(''):'<p class="muted small" style="text-align:center;margin:auto">Only you can see these notes.</p>'}</div>
    <div class="recline" id="recLine" hidden></div>
    <div class="sugg" id="sugg" hidden></div>
    <div class="compose">
      <button class="round sm" id="dmShare" aria-label="Share a memory">${svg('plus',18)}</button>
      <input class="txt" id="dmIn" placeholder="Note to self" autocomplete="off">
      <button class="round sm" id="dmAI" aria-label="Caption ideas">${svg('spark',18)}</button>
      <button class="round sm" id="dmMic" aria-label="Hold to record a voice note">${svg('mic',18)}</button>
    </div></div>`;
  mount(root);
  $('#msgs').scrollTop=1e6;
  $('#dmBack').onclick=()=>{ dmOpen=null; renderDM(); };
  $('#dmIn').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.value.trim()){ state.dm.push({f:'me',t:'text',v:e.target.value.trim()}); save(); renderDM(); } });
  $('#dmAI').onclick=()=>{
    const s=$('#sugg'); s.hidden=!s.hidden;
    s.innerHTML=captionPool().slice(0,3).map(x=>`<button class="chip" data-sg="${esc(x)}">${esc(x)}</button>`).join('');
    $$('[data-sg]',s).forEach(b=>b.onclick=()=>{ $('#dmIn').value=b.dataset.sg; $('#dmIn').focus(); });
  };
  $('#dmShare').onclick=()=>{
    if(!ALL.length){ toast('Create a memory first, then share it here'); return; }
    openSheet(`<div class="grab"></div><h2>Share a memory</h2><p class="muted small">Shared in Direct only. Not posted to your canvas.</p>
      <div class="pick">${ALL.slice(0,6).map(p=>`<button class="opt" data-share="${p.id}"><b>${esc(p.title)}</b><span>@${esc(p.author)}</span></button>`).join('')}</div>`,()=>{
      $$('[data-share]').forEach(b=>b.onclick=()=>{ state.dm.push({f:'me',t:'memory',pid:+b.dataset.share}); save(); closeSheet(); renderDM(); });
    });
  };
  const mic=$('#dmMic');
  mic.addEventListener('pointerdown',e=>{
    e.preventDefault(); dmRec={t0:Date.now()}; mic.classList.add('live');
    const rl=$('#recLine'); rl.hidden=false; rl.textContent='Recording… release to save';
    dmRec.iv=setInterval(()=>{ const s=Math.floor((Date.now()-dmRec.t0)/1000); rl.textContent=`Recording 0:${String(s).padStart(2,'0')} · release to save`; },250);
  });
}
window.addEventListener('pointerup',()=>{
  if(!dmRec) return;
  clearInterval(dmRec.iv);
  const d=Math.max(1,Math.round((Date.now()-dmRec.t0)/1000)); dmRec=null;
  state.dm.push({f:'me',t:'voice',d}); save(); renderDM();
});

/* ============================ 14. PROFILE ============================ */
function renderProfile(){
  const root=$('#v-profile');
  const entries=Object.entries(state.taste).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=Math.max(1,...entries.map(e=>e[1]));
  root.innerHTML=`
    <div class="topbar"><div class="wordmark sm">you</div><span class="muted small">Only you can see this page</span></div>
    <div class="hero">
      <div class="av-xl"><i>${esc(user.name[0].toUpperCase())}</i></div>
      <h2>${esc(user.name)}</h2>
      <div class="muted small">@${esc(user.handle)}${user.city?' · '+esc(user.city):''}</div>
      <p class="bio">${state.posts.length?'Your canvas is taking shape.':'No memories yet. Your first one becomes your cover.'}</p>
      <div class="stats">
        <div><b>${state.posts.length}</b><span>memories</span></div>
        <div><b>0</b><span>followers</span></div>
        <div><b>${state.twin}%</b><span>voice trained</span></div>
      </div>
    </div>
    <div class="sec"><h4>Aesthetic DNA</h4>
      ${entries.length?`<div class="dna">${entries.map(([k,v])=>`<div><b>${esc(k)}</b><span class="bar"><i style="width:${Math.round(v/max*100)}%"></i></span><em>${Math.round(v/max*100)}</em></div>`).join('')}</div>
      <p class="muted small" style="margin:10px 0 0">Seeded from your interests. Saves and remixes move it over time, not likes.</p>`
      :'<p class="muted small">Pick interests during sign-up to seed this.</p>'}
    </div>
    <div class="glass twin">
      <h4 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:0 0 10px">Digital Twin</h4>
      <p>Your voice model learns from the captions you publish. It starts empty and never posts without your tap.</p>
      <div class="bar"><i style="width:${state.twin}%"></i></div>
      <button class="btn ghost" id="teach">${state.twin>=100?'Voice fully learned':'Publish a memory to train it'}</button>
    </div>
    <div class="sec"><h4>Memories</h4>
      ${state.posts.length
        ? `<div class="grid3">${state.posts.map(p=>`<div class="tile"><canvas data-draw="thumb" data-id="${p.id}"></canvas></div>`).join('')}</div>`
        : `<div class="empty glass" style="margin:0"><p>Your memories appear here as a grid. Tap + to create the first one.</p></div>`}
    </div>
    <div class="sec"><h4>Privacy & ambience</h4>
      <div class="row"><span>Viewers can nudge my stories</span><button class="sw ${state.nudgePerm?'on':''}" data-sw="nudge" aria-label="Toggle nudges"></button></div>
      <div class="row"><span>Ambient motion</span><button class="sw ${state.motion?'on':''}" data-sw="motion" aria-label="Toggle motion"></button></div>
      <div class="row"><span>Theme</span><div class="seg" style="padding:0">${['auto','dark','light'].map(m=>`<button data-theme-mode="${m}" class="${state.theme===m?'on':''}">${cap(m)}</button>`).join('')}</div></div>
      <div class="row"><span>Account</span><button class="chip" id="logout" style="display:flex;gap:6px;align-items:center">${svg('logout',16)}Log out</button></div>
    </div>
    <div class="foot">Account data is stored in this browser for the prototype. Production accounts sync through a secure backend. The AI layers (ranking, search, outpainting, captions, merges) are simulated with deterministic rules. See Aether_Blueprint.md.</div>`;
  mount(root);
  $('#teach').onclick=()=>{
    if(state.twin>=100) return toast('Your voice model is fully trained');
    if(!state.posts.length) return toast('Publish your first memory to start training your voice');
    toast('Trains as you caption and publish memories');
  };
  $$('[data-sw]',root).forEach(b=>b.onclick=()=>{
    if(b.dataset.sw==='nudge') state.nudgePerm=!state.nudgePerm;
    if(b.dataset.sw==='motion') state.motion=!state.motion;
    save(); renderProfile();
  });
  $$('[data-theme-mode]',root).forEach(b=>b.onclick=()=>{ state.theme=b.dataset.themeMode; save(); applyTheme(); renderProfile(); });
  $('#logout').onclick=logOut;
}
